config_version = 14

[bar]
order = [ "default" ]

    [bar.default]
    auto_hide = false
    # Full-bleed solid strip (margin_ends MUST stay 0 — >0 leaves wallpaper holes).
    # No spacers: launcher/power sit right at the screen edges.
    background_opacity = 1.0
    capsule = false
    capsule_opacity = 1.0
    center = []
    enabled = true
    end = [
        "clean-desktop",
        "tray",
        "notifications",
        "network",
        "volume",
        "battery",
        "control-center",
        "session"
    ]
    layer = "top"
    margin_edge = 0
    margin_ends = 0
    padding = 12
    position = "bottom"
    radius = 0
    # Shared bottom band with niri-rail (strut clears windows; no exclusive fight).
    reserve_space = false
    scale = 1.0
    shadow = false
    # Workspaces are drawn by niri-rail (dashes + roman numeral) right after the launcher.
    start = [ "launcher" ]
    thickness = 42
    widget_spacing = 6

    # Same logical 1920×1080 on laptop (scale 1) and TV (scale 2).
    [bar.default.monitor.edp]
    match = "eDP-1"
    margin_ends = 0
    thickness = 42
    scale = 1.0

    [bar.default.monitor.hdmi]
    match = "HDMI-A-4"
    margin_ends = 0
    thickness = 42
    scale = 1.0

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
auto_update = "all"
enabled = [
    "thaer99ob/default-apps",
    "tordex/system-updater",
    "gabriel/clean-desktop",
]

[shell]
font_family = "Roboto Flex"
panel_anchor_bar = "default"

    [shell.launcher]
    app_grid = true
    show_app_actions = true

    [shell.panel]
    control_center_placement = "floating"
    floating_layer = "top"
    launcher_position = "auto"
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "glass"

    [shell.session]
    grid = true

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = []
    community_ids = []
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "/home/gabriel/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/gabriel/Pictures/Wallpapers/astro.jpg"

    [wallpaper.last]
    path = "/home/gabriel/Pictures/Wallpapers/astro.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/gabriel/Pictures/Wallpapers/astro.jpg"

[widget.launcher]
glyph = "grid-dots"

[widget.clean-desktop]
type = "gabriel/clean-desktop:toggle"
