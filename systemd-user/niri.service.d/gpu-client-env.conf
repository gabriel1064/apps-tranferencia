# Clients inherit this. Compositor render GPU is chosen via niri config
# (niri-dock-outputs). Default to Intel/Mesa so Thorium works on the laptop;
# dock script updates systemd env + re-execs niri when HDMI is connected.
[Service]
UnsetEnvironment=__NV_PRIME_RENDER_OFFLOAD __VK_LAYER_NV_optimus VK_ICD_FILENAMES GBM_BACKEND NVD_BACKEND
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
Environment=__GLX_VENDOR_LIBRARY_NAME=mesa
Environment=LIBVA_DRIVER_NAME=iHD
Environment=MESA_LOADER_DRIVER_OVERRIDE=iris
